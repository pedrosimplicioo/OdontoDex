<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OdontoDex Admin - Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/admin.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>
<body>

<div id="login-container" class="login-container">
  <div class="login-box">
    <h2>OdontoDex Admin</h2>
    <p>Acesso restrito ao administrador</p>
    <input type="email" id="admin-email" class="login-input" placeholder="seu@email.com">
    <input type="password" id="admin-password" class="login-input" placeholder="••••••">
    <button class="login-btn" onclick="doAdminLogin()">Entrar</button>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<div id="dashboard-container" class="dashboard-container">
  <div id="sidebar" class="sidebar expanded">
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-logo"><h2>OdontoDex</h2><p>Admin Dashboard</p></div>
    <div class="sidebar-menu">
      <div class="sidebar-item active" data-section="dashboard"><span>📊</span><span>Dashboard</span></div>
      <div class="sidebar-item" data-section="usuarios"><span>👥</span><span>Usuários</span></div>
      <div class="sidebar-item" data-section="parceiros"><span>🤝</span><span>Parceiros</span></div>
      <div class="sidebar-item" data-section="conteudo"><span>🧩</span><span>Conteúdo</span></div>
    </div>
    <div class="sidebar-footer"><div class="logout-sidebar" onclick="logout()"><span>🚪</span><span>Sair</span></div></div>
  </div>
  <div class="main-content"><div id="content-area"></div></div>
</div>

<div class="drawer-overlay" id="drawer-overlay" onclick="fecharDrawer()"></div>
<div class="drawer" id="user-drawer">
  <div class="drawer-header">
    <span class="drawer-title" id="drawer-nome">Usuário</span>
    <button class="drawer-close" onclick="fecharDrawer()">✕</button>
  </div>
  <div class="drawer-body">
    <div class="drawer-section">
      <div class="drawer-section-title">Informações</div>
      <div class="drawer-info-row"><span class="drawer-info-label">Email</span><span class="drawer-info-value" id="di-email">-</span></div>
      <div class="drawer-info-row"><span class="drawer-info-label">Status</span><span class="drawer-info-value" id="di-status">-</span></div>
      <div class="drawer-info-row"><span class="drawer-info-label">Perfil</span><span class="drawer-info-value" id="di-perfil">-</span></div>
      <div class="drawer-info-row"><span class="drawer-info-label">Cadastro</span><span class="drawer-info-value" id="di-cadastro">-</span></div>
      <div class="drawer-info-row"><span class="drawer-info-label">Primeiro acesso</span><span class="drawer-info-value" id="di-primeiro">-</span></div>
      <div class="drawer-info-row"><span class="drawer-info-label">Último acesso</span><span class="drawer-info-value" id="di-ultimo">-</span></div>
      <div class="drawer-info-row"><span class="drawer-info-label">Expira em</span><span class="drawer-info-value" id="di-expira">-</span></div>
      <div class="drawer-info-row"><span class="drawer-info-label">Usos (90d)</span><span class="drawer-info-value" id="di-usos">-</span></div>
      <div class="drawer-info-row"><span class="drawer-info-label">Último pagamento</span><span class="drawer-info-value" id="di-pagamento">-</span></div>
    </div>
    <div class="drawer-section" id="drawer-acoes">
      <div class="drawer-section-title">Ações</div>
      <div id="drawer-acoes-conteudo"></div>
      <div class="drawer-feedback" id="drawer-feedback"></div>
    </div>
  </div>
</div>

<script src="src/data/clinical-data.js"></script>
<script src="src/scripts/admin.js" defer></script>
</body>
</html>
